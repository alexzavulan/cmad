# lambda in normalised units: each distance of the negative-bank score is divided by its median
# over the validation-normal patches, and lambda is selected on a wider grid. DINOv2-S, ground-truth
# -mask negatives, k = 1 and 5, 5 seeds, so every run pairs with a run of e04_neg_bank (same
# category, seed and split, raw lambda). Within a run a constant scale only rescales lambda, so
# per-category selection should reproduce e04_neg_bank up to where the grid points fall; the
# question these runs answer is whether ONE lambda for all categories (chosen on the other
# categories' leave-one-support-out curves) works better in normalised units than in raw ones.
tier: core
walltime: "02:00:00"
overrides:
  - scorer=negbank
  - backbone.name=dinov2_vits14
  - layers.names=[last_raw]
  - scorer.normalize=true
  - scorer.source=gt_mask
  - scorer.scale=val_median
  - scorer.lambdas=[0.0,0.25,0.5,1.0,1.5,2.0,3.0,4.0,6.0,8.0,12.0,16.0,24.0]
grid:
  regime.name: [few_abn_k1, few_abn_k5]
  seed: [0, 1, 2, 3, 4]
