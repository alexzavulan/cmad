# Plain kNN on the leave-one-defect-type-out splits, DINOv2-S and -B. kNN ignores the support
# faults but is scored on the same test set as the negative bank of e06_lodo_neg_bank, so these
# runs give the kNN pixel metrics per fold, and their image scores must equal the lambda = 0
# scores stored in the matching negative-bank runs (a consistency check).
tier: core
walltime: "01:30:00"
overrides:
  - scorer=knn
  - layers.names=[last_raw]
  - scorer.normalize=true
grid:
  backbone.name: [dinov2_vits14, dinov2_vitb14]
  regime.name:
    bottle: [lodo_broken_large, lodo_broken_small, lodo_contamination]
    cable: [lodo_bent_wire, lodo_cable_swap, lodo_cut_inner_insulation, lodo_cut_outer_insulation, lodo_missing_cable, lodo_missing_wire, lodo_poke_insulation]
    capsule: [lodo_crack, lodo_faulty_imprint, lodo_poke, lodo_scratch, lodo_squeeze]
    carpet: [lodo_color, lodo_cut, lodo_hole, lodo_metal_contamination, lodo_thread]
    grid: [lodo_bent, lodo_broken, lodo_glue, lodo_metal_contamination, lodo_thread]
    hazelnut: [lodo_crack, lodo_cut, lodo_hole, lodo_print]
    leather: [lodo_color, lodo_cut, lodo_fold, lodo_glue, lodo_poke]
    metal_nut: [lodo_bent, lodo_color, lodo_flip, lodo_scratch]
    pill: [lodo_color, lodo_contamination, lodo_crack, lodo_faulty_imprint, lodo_pill_type, lodo_scratch]
    screw: [lodo_manipulated_front, lodo_scratch_head, lodo_scratch_neck, lodo_thread_side, lodo_thread_top]
    tile: [lodo_crack, lodo_glue_strip, lodo_gray_stroke, lodo_oil, lodo_rough]
    transistor: [lodo_bent_lead, lodo_cut_lead, lodo_damaged_case, lodo_misplaced]
    wood: [lodo_color, lodo_hole, lodo_liquid, lodo_scratch]
    zipper: [lodo_broken_teeth, lodo_fabric_border, lodo_fabric_interior, lodo_rough, lodo_split_teeth, lodo_squeezed_teeth]
  seed: [0, 1, 2, 3, 4]
