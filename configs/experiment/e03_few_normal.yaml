# Few-normal kNN: the memory bank holds only k training normals (drawn at random per seed; a smaller
# k is always a subset of a larger one). DINOv2-S and -B, last block, normalised by the scorer (cosine).
# WRN-50 has its own file (e03_few_normal_wrn).
tier: core
walltime: "02:00:00"
overrides:
  - scorer=knn
  - layers.names=[last_raw]
  - scorer.normalize=true
grid:
  backbone.name: [dinov2_vits14, dinov2_vitb14]
  regime.name: [few_norm_k1, few_norm_k2, few_norm_k4, few_norm_k8, few_norm_k16]
  seed: [0, 1, 2, 3, 4]
