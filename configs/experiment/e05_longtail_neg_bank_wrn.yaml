# Long-tailed labelled faults, negative bank, WRN-50 (raw PatchCore embedding, Euclidean, whole
# image at 224). Same splits and settings as e05_longtail_neg_bank.
tier: core
walltime: "02:00:00"
overrides:
  - backbone=wrn50_in1k
  - scorer=negbank
  - scorer.source=gt_mask
  - scorer.scale=val_median
  - scorer.lambdas=[0.0,0.25,0.5,1.0,1.5,2.0,3.0,4.0,6.0,8.0,12.0,16.0,24.0]
grid:
  regime.name:
    bottle: [longtail_r1, longtail_r3, longtail_r10]
    cable: [longtail_r1, longtail_r3, longtail_r10]
    capsule: [longtail_r1, longtail_r3, longtail_r10]
    carpet: [longtail_r1, longtail_r3, longtail_r10]
    grid: [longtail_r1, longtail_r3, longtail_r10]
    hazelnut: [longtail_r1, longtail_r3, longtail_r10]
    leather: [longtail_r1, longtail_r3, longtail_r10]
    metal_nut: [longtail_r1, longtail_r3, longtail_r10]
    pill: [longtail_r1, longtail_r3, longtail_r10]
    screw: [longtail_r1, longtail_r3, longtail_r10]
    tile: [longtail_r1, longtail_r3, longtail_r10]
    transistor: [longtail_r1, longtail_r3, longtail_r10]
    wood: [longtail_r1, longtail_r3, longtail_r10]
    zipper: [longtail_r1, longtail_r3, longtail_r10]
  seed: [0, 1, 2, 3, 4]
