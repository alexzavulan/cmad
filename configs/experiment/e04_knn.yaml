# Plain kNN on the few-abnormal splits (k labelled faults per defect type), DINOv2-S and -B.
# kNN ignores the support faults but is scored on the same reduced test set as the negative bank,
# so these runs give the kNN pixel metrics at each k, and their image scores must equal the
# lambda = 0 scores stored in the matching neg_bank runs (a consistency check).
tier: core
walltime: "01:30:00"
overrides:
  - scorer=knn
  - layers.names=[last_raw]
  - scorer.normalize=true
grid:
  backbone.name: [dinov2_vits14, dinov2_vitb14]
  regime.name: [few_abn_k1, few_abn_k5, few_abn_k10]
  seed: [0, 1, 2, 3, 4]
