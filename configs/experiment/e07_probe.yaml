# Linear probes, DINOv2-S and -B: L2-regularised logistic regression (C = 1) on one global feature
# per image (class token and mean patch token of the bank's block), fitted to convergence with
# full-batch L-BFGS. Three losses: ce, wce (the headline probe) and focal. Runs on the splits of
# the negative bank: k = 1, 5, 10 labelled faults per defect type, and every leave-one-defect-
# type-out fold (toothbrush has a single defect type and only the few-fault regimes).
tier: core
walltime: "02:00:00"
overrides:
  - scorer=probe
  - layers.names=[last_raw]
grid:
  backbone.name: [dinov2_vits14, dinov2_vitb14]
  scorer.loss: [ce, wce, focal]
  regime.name:
    bottle: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_broken_large, lodo_broken_small, lodo_contamination]
    cable: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_bent_wire, lodo_cable_swap, lodo_cut_inner_insulation, lodo_cut_outer_insulation, lodo_missing_cable, lodo_missing_wire, lodo_poke_insulation]
    capsule: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_crack, lodo_faulty_imprint, lodo_poke, lodo_scratch, lodo_squeeze]
    carpet: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_color, lodo_cut, lodo_hole, lodo_metal_contamination, lodo_thread]
    grid: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_bent, lodo_broken, lodo_glue, lodo_metal_contamination, lodo_thread]
    hazelnut: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_crack, lodo_cut, lodo_hole, lodo_print]
    leather: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_color, lodo_cut, lodo_fold, lodo_glue, lodo_poke]
    metal_nut: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_bent, lodo_color, lodo_flip, lodo_scratch]
    pill: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_color, lodo_contamination, lodo_crack, lodo_faulty_imprint, lodo_pill_type, lodo_scratch]
    screw: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_manipulated_front, lodo_scratch_head, lodo_scratch_neck, lodo_thread_side, lodo_thread_top]
    tile: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_crack, lodo_glue_strip, lodo_gray_stroke, lodo_oil, lodo_rough]
    toothbrush: [few_abn_k1, few_abn_k5, few_abn_k10]
    transistor: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_bent_lead, lodo_cut_lead, lodo_damaged_case, lodo_misplaced]
    wood: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_color, lodo_hole, lodo_liquid, lodo_scratch]
    zipper: [few_abn_k1, few_abn_k5, few_abn_k10, lodo_broken_teeth, lodo_fabric_border, lodo_fabric_interior, lodo_rough, lodo_split_teeth, lodo_squeezed_teeth]
  seed: [0, 1, 2, 3, 4]
